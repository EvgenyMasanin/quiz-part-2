<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тест — 2 часть</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1c1d21;--muted:#6b7080;--line:#dfe2e8;--accent:#2f6fed;--ok:#1b8a4a;--ok-bg:#e6f6ec;--bad:#c93a3a;--bad-bg:#fdecec}
@media (prefers-color-scheme:dark){:root{--bg:#121316;--card:#1d1f24;--text:#eceef3;--muted:#9aa0ae;--line:#30333b;--accent:#5b8ef5;--ok:#5ccf8b;--ok-bg:#15301f;--bad:#f27b7b;--bad-bg:#3a1c1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:640px;margin:0 auto;padding:12px 16px calc(100px + env(safe-area-inset-bottom))}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px}
#count{font-weight:600;font-variant-numeric:tabular-nums}
#restart{height:auto;padding:6px 0;background:none;color:var(--accent);font-size:15px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 8px;text-align:center}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 2px}
.stats b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.stats small{font-size:11px;color:var(--muted)}
.stats .ok b{color:var(--ok)}
.stats .bad b{color:var(--bad)}
.bar{display:flex;height:6px;background:var(--line);border-radius:3px;margin-bottom:16px;overflow:hidden}
.bar i{transition:width .2s}
#barOk{background:var(--ok)}
#barBad{background:var(--bad)}
#section{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted);margin-bottom:6px}
h1{font-size:19px;line-height:1.35;margin:0 0 6px;font-weight:600}
#hint{font-size:14px;color:var(--muted);margin-bottom:14px}
label{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer}
label span{flex:1}
input{flex:none;width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent)}
label.ok{border-color:var(--ok);background:var(--ok-bg)}
label.bad{border-color:var(--bad);background:var(--bad-bg)}
label.ok::after,label.bad::after{flex:none;font-weight:700}
label.ok::after{content:"✓";color:var(--ok)}
label.bad::after{content:"✗";color:var(--bad)}
#result{border-radius:12px;padding:14px;margin-top:4px;font-size:15px;scroll-margin-bottom:calc(92px + env(safe-area-inset-bottom))}
#result.ok{background:var(--ok-bg)}
#result.bad{background:var(--bad-bg)}
#result b{display:block;font-size:18px;margin-bottom:2px}
#result.ok b{color:var(--ok)}
#result.bad b{color:var(--bad)}
#result ul{margin:6px 0 0;padding-left:20px}
#result p{margin:8px 0 0;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
nav div{max-width:608px;margin:0 auto;display:flex;gap:10px}
button{height:52px;border:0;border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.arrow{width:56px;flex:none;background:var(--card);color:var(--text);border:1.5px solid var(--line);font-size:22px}
#main{flex:1;background:var(--accent);color:#fff}
button:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>
<main>
  <div class="head"><span id="count"></span><button id="restart">Новая сессия</button></div>
  <div class="stats">
    <div><b id="sDone"></b><small>Отвечено</small></div>
    <div class="ok"><b id="sOk"></b><small>Верно</small></div>
    <div class="bad"><b id="sBad"></b><small>Неверно</small></div>
    <div><b id="sLeft"></b><small>Осталось</small></div>
  </div>
  <div class="bar"><i id="barOk"></i><i id="barBad"></i></div>
  <div id="section"></div>
  <h1 id="q"></h1>
  <div id="hint"></div>
  <div id="options"></div>
  <div id="result" hidden></div>
</main>
<nav><div>
  <button class="arrow" id="prev" aria-label="Предыдущий вопрос">←</button>
  <button id="main"></button>
  <button class="arrow" id="next" aria-label="Следующий вопрос">→</button>
</div></nav>
<script src="questions.js"></script>
<script>
const Q = window.QUESTIONS, N = Q.length, $ = s => document.querySelector(s);
const boxes = () => [...document.querySelectorAll('#options input')];
const fresh = () => ({ i: 0, answers: {} }); // answers: номер вопроса → выбранные варианты
let s;
try { s = JSON.parse(localStorage.getItem('quiz-session')) || fresh(); } catch { s = fresh(); }
if (!(s.i >= 0 && s.i < N) || typeof s.answers !== 'object') s = fresh();
const save = () => { try { localStorage.setItem('quiz-session', JSON.stringify(s)); } catch {} };

const isRight = k => {
  const p = s.answers[k], c = Q[k].correct;
  return p.length === c.length && p.every(x => c.includes(x));
};
const nextUnanswered = () => {
  for (let d = 1; d < N; d++) if (!s.answers[(s.i + d) % N]) return (s.i + d) % N;
  return -1;
};

function stats() {
  const done = Object.keys(s.answers).map(Number), ok = done.filter(isRight).length;
  $('#count').textContent = `Вопрос ${s.i + 1} из ${N}`;
  $('#sDone').textContent = done.length;
  $('#sOk').textContent = ok;
  $('#sBad').textContent = done.length - ok;
  $('#sLeft').textContent = N - done.length;
  $('#barOk').style.width = ok / N * 100 + '%';
  $('#barBad').style.width = (done.length - ok) / N * 100 + '%';
}

function render() {
  const q = Q[s.i];
  save();
  $('#section').textContent = q.section;
  $('#q').textContent = q.q;
  $('#hint').textContent = q.multi ? 'Выберите один или несколько ответов' : 'Выберите один ответ';
  $('#options').replaceChildren(...q.options.map((o, k) => {
    const l = document.createElement('label'), c = document.createElement('input'), t = document.createElement('span');
    c.type = 'checkbox'; c.value = k; t.textContent = o;
    l.append(c, t);
    return l;
  }));
  $('#result').hidden = true;
  $('#main').textContent = 'Ответить';
  $('#prev').disabled = s.i === 0;
  $('#next').disabled = s.i === N - 1;
  if (s.answers[s.i]) showResult(false); else updateMain();
  stats();
  scrollTo(0, 0);
}

function updateMain() { $('#main').disabled = !s.answers[s.i] && !boxes().some(b => b.checked); }

function showResult(scroll) {
  const q = Q[s.i], picked = s.answers[s.i], ok = isRight(s.i);
  boxes().forEach((b, k) => {
    b.checked = picked.includes(k);
    b.disabled = true;
    if (q.correct.includes(k)) b.parentNode.className = 'ok';
    else if (b.checked) b.parentNode.className = 'bad';
  });
  const r = $('#result'), title = document.createElement('b');
  title.textContent = ok ? 'Правильно!' : 'Неправильно';
  r.replaceChildren(title);
  if (!ok) {
    const ul = document.createElement('ul');
    ul.append(...q.correct.map(k => Object.assign(document.createElement('li'), { textContent: q.options[k] })));
    r.append(q.correct.length > 1 ? 'Правильные ответы:' : 'Правильный ответ:', ul);
  }
  const done = nextUnanswered() < 0;
  if (done) {
    const right = Object.keys(s.answers).filter(isRight).length;
    r.append(Object.assign(document.createElement('p'), { textContent: `Сессия завершена: верно ${right} из ${N}` }));
  }
  r.className = ok ? 'ok' : 'bad';
  r.hidden = false;
  $('#main').textContent = done ? 'Начать новую сессию' : 'Следующий вопрос →';
  updateMain();
  if (scroll) r.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function answer() {
  s.answers[s.i] = boxes().filter(b => b.checked).map(b => +b.value);
  save();
  showResult(true);
  stats();
}

function restart() {
  if (Object.keys(s.answers).length && !confirm('Начать новую сессию? Все ответы будут сброшены.')) return;
  s = fresh();
  render();
}

const go = n => { s.i = n; render(); };
$('#options').onchange = e => {
  // в вопросах с одним ответом новая галочка снимает прежнюю
  if (!Q[s.i].multi && e.target.checked) boxes().forEach(b => b.checked = b === e.target);
  updateMain();
};
$('#main').onclick = () => {
  if (!s.answers[s.i]) return answer();
  const n = nextUnanswered();
  n < 0 ? (s = fresh(), render()) : go(n);
};
$('#restart').onclick = restart;
$('#prev').onclick = () => go(s.i - 1);
$('#next').onclick = () => go(s.i + 1);
render();
</script>
</body>
</html>
