<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренировочное тестирование</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тренажёр">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
button:disabled,button.off{opacity:.45;cursor:default}
/* вариант под фокусом клавиатуры — фон чуть темнее; после кликов мышью и на телефоне выделения нет */
@media (hover:hover) and (pointer:fine){
  .exam label:has(input:focus-visible){background:#cde5ea;border-radius:3px}
  .exam label input:focus-visible{outline:none}
  .cards label:has(input:focus-visible){border-color:var(--accent)}
}
main{max-width:640px;margin:0 auto;padding:12px 16px 32px}
.exam .c,.cards .x{display:none!important}
.pick{margin-bottom:10px}
.pick select{width:100%;font:inherit;padding:7px 8px;border:1px solid #8f959e;border-radius:4px;background:#fff;color:#1d2125}
.cards .pick select{font-size:15px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}

/* ===== Режим «как на экзамене» (основной) ===== */
.exam{background:#fff;color:#1d2125;font-size:15px;line-height:1.5}
header{position:sticky;top:0;z-index:1;background:#fff;padding:14px 16px;font-size:20px;box-shadow:0 2px 4px rgba(0,0,0,.08)}
.xstats{font-size:14px;color:#495057;margin:4px 0 16px}
.info{background:#f8f9fa;border:1px solid #dee2e6;border-radius:4px;padding:10px 12px;margin-bottom:20px;font-size:14px}
.info b{font-size:16px}
.exam .box{background:#e7f3f5;border:1px solid #b8dce2;border-radius:4px;padding:20px;color:#001a1e}
.exam h1{font-size:15px;font-weight:400;margin:0}
.exam #hint{margin:16px 0 8px}
.exam #options{margin-left:6px}
.exam label{display:flex;gap:10px;align-items:flex-start;padding:4px 6px;margin:0 -6px;cursor:pointer}
.exam label input{flex:none;width:16px;height:16px;margin:4px 0 0}
.exam label span{flex:1}
.exam label.ok::after,.exam label.bad::after{flex:none;margin-left:12px;font-weight:700}
.exam label.ok::after{content:"✓";color:#357a32}
.exam label.ok:not(.picked)::after{content:"✓ пропущен";color:#b45309;font-size:13px;white-space:nowrap}
.exam label.bad::after{content:"✗";color:#ca3120}
.btn{border:0;border-radius:4px;padding:7px 14px;color:#fff;background:#6c757d}
.exam #check{margin-top:12px}
.exam #result{background:#fcefdc;border:1px solid #fbe6ca;color:#8e662e;border-radius:4px;padding:20px;margin-top:16px}
.exam #result p{margin:8px 0 0;font-weight:600}
.pager{display:flex;margin-top:28px}
.pager .btn{flex:1;padding:8px 4px;font-size:14px}
.pager .btn+.btn{background:#13306d}
.qnav{margin-top:32px}
.qnav h2{font-size:20px;font-weight:400;margin:0 0 4px}
#grid{display:flex;flex-wrap:wrap;gap:6px}
.sec{flex-basis:100%;margin-top:10px;font-size:14px}
.qn{position:relative;width:32px;height:42px;padding:0 0 12px;border:1px solid #8f959e;border-radius:4px;background:#fff;color:#1d2125;font-size:13px;overflow:hidden}
.qn::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;border-top:1px solid #8f959e;font-size:9px;line-height:11px;color:#fff}
.qn.right::after{content:"✓";background:#357a32}
.qn.wrong::after{content:"✗";background:#ca3120}
.qn.part::after{content:"✓";background:#f0ad4e}
.qn.cur{border:2px solid #1d2125}
.qn.flag::before{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 10px 10px 0;border-color:transparent #ca3120 transparent transparent}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-top:24px}
.link{background:none;border:0;padding:6px 0;color:#0f6cbf}
.flagbtn{padding:2px 0;text-align:left}
.flagbtn.on{color:#ca3120}

/* ===== Режим «карточки» (альтернативный) ===== */
.cards{--bg:#f4f5f7;--card:#fff;--text:#1c1d21;--muted:#6b7080;--line:#dfe2e8;--accent:#2f6fed;--ok:#1b8a4a;--ok-bg:#e6f6ec;--bad:#c93a3a;--bad-bg:#fdecec;--part:#c96a0e;--part-bg:#fdf1e3;background:var(--bg);color:var(--text);font-size:17px;line-height:1.45}
@media (prefers-color-scheme:dark){.cards{--bg:#121316;--card:#1d1f24;--text:#eceef3;--muted:#9aa0ae;--line:#30333b;--accent:#5b8ef5;--ok:#5ccf8b;--ok-bg:#15301f;--bad:#f27b7b;--bad-bg:#3a1c1c;--part:#f0a35e;--part-bg:#3a2a17}}
.cards main{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0 12px;font-size:15px}
#count{font-weight:600;font-variant-numeric:tabular-nums}
.head .links{display:flex;gap:14px}
.cards .link{color:var(--accent);font-size:14px}
.cards .flagbtn{font-size:13px}
.cards .flagbtn.on{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0;text-align:center}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 2px}
.stats b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.stats small{font-size:11px;color:var(--muted)}
.stats .ok b{color:var(--ok)}
.stats .bad b{color:var(--bad)}
.stats .part b{color:var(--part)}
.bar{display:flex;height:6px;background:var(--line);border-radius:3px;margin-bottom:16px;overflow:hidden}
.bar i{transition:width .2s}
#barOk{background:var(--ok)}
#barBad{background:var(--bad)}
#barPart{background:var(--part)}
.secrow{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0 12px;margin-bottom:6px}
#section{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.cards h1{font-size:19px;line-height:1.35;margin:0 0 6px;font-weight:600}
.cards #hint{font-size:14px;color:var(--muted);margin-bottom:14px}
.cards label{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer}
.cards label span{flex:1}
.cards label input{flex:none;width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent)}
.cards label.ok{border-color:var(--ok);background:var(--ok-bg)}
.cards label.bad{border-color:var(--bad);background:var(--bad-bg)}
.cards label.ok::after,.cards label.bad::after{flex:none;font-weight:700}
.cards label.ok::after{content:"✓";color:var(--ok)}
.cards label.bad::after{content:"✗";color:var(--bad)}
.cards #result{border-radius:12px;padding:14px;margin-top:4px;font-size:15px;scroll-margin-bottom:calc(92px + env(safe-area-inset-bottom))}
.cards #result.ok{background:var(--ok-bg)}
.cards #result.bad{background:var(--bad-bg)}
.cards #result b{display:block;font-size:18px;margin-bottom:2px}
.cards #result.ok b{color:var(--ok)}
.cards #result.bad b{color:var(--bad)}
.cards #result.part{background:var(--part-bg)}
.cards #result.part b{color:var(--part)}
.cards #result ul{margin:6px 0 0;padding-left:20px}
.cards #result p{margin:8px 0 0;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
nav div{max-width:608px;margin:0 auto;display:flex;gap:10px}
nav button{height:52px;border:0;border-radius:12px;font-weight:600}
.arrow{width:56px;flex:none;background:var(--card);color:var(--text);border:1.5px solid var(--line);font-size:22px}
#main{flex:1;background:var(--accent);color:#fff}
</style>
</head>
<body>
<header class="x">Тренировочное тестирование</header>
<main>
  <div class="pick"><select id="test" aria-label="Тест и сессия"></select></div>
  <div class="c head"><span id="count"></span><span class="links"><button class="link" data-view>Вид экзамена</button><button class="link" data-restart>Новая сессия</button></span></div>
  <div class="c stats">
    <div><b id="sDone"></b><small>Отвечено</small></div>
    <div class="ok"><b id="sOk"></b><small>Верно</small></div>
    <div class="part"><b id="sPart"></b><small>Частично</small></div>
    <div class="bad"><b id="sBad"></b><small>Неверно</small></div>
    <div><b id="sLeft"></b><small>Осталось</small></div>
  </div>
  <div class="c bar"><i id="barOk"></i><i id="barPart"></i><i id="barBad"></i></div>
  <div class="x xstats" id="xstats"></div>
  <div class="x info"><div>Вопрос <b id="xnum"></b></div><div id="xstate"></div><div id="xgrade"></div><button class="link flagbtn" data-flag></button></div>
  <div class="box">
    <div class="c secrow"><span id="section"></span><button class="link flagbtn" data-flag></button></div>
    <h1 id="q"></h1>
    <div id="hint"></div>
    <div id="options"></div>
    <button class="x btn" id="check">Проверить</button>
  </div>
  <div id="result" hidden></div>
  <div class="x pager"><button class="btn" id="xprev">Предыдущая страница</button><button class="btn" id="xnext">Следующая страница</button></div>
  <div class="x qnav">
    <h2>Навигация по тесту</h2>
    <div id="grid"></div>
    <div class="actions"><button class="btn" data-restart>Начать новую сессию</button><button class="link" data-view>Простой вид</button></div>
  </div>
</main>
<nav class="c"><div>
  <button class="arrow" id="prev" aria-label="Предыдущий вопрос">←</button>
  <button id="main"></button>
  <button class="arrow" id="next" aria-label="Следующий вопрос">→</button>
</div></nav>
<script src="questions.js"></script>
<script>
const T = window.TESTS, $ = s => document.querySelector(s);
const el = (tag, props) => Object.assign(document.createElement(tag), props);
const boxes = () => [...document.querySelectorAll('#options input')];
const readJSON = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const KINDS = { all: 'все вопросы', mistakes: 'работа над ошибками', flags: 'отмеченные' };
// right — всё верно; part — есть верный выбор, но не все верные или есть лишние; wrong — ни одного верного
const gradeOf = (q, picked) => {
  const hit = picked.filter(x => q.correct.includes(x)).length;
  return hit === q.correct.length && picked.length === hit ? 'right' : hit ? 'part' : 'wrong';
};
// s — сессия: i — текущий вопрос, answers — номер вопроса → выбранные варианты, list — вопросы сессии (null — все)
// p — профиль теста, живёт дольше сессий: mistakes — вопросы с последним ответом не полностью верно, flags — отмеченные
let Q, N, ALL, s, p, view, test, kind;
// у «2 части» прежний ключ, чтобы не потерять уже начатую сессию
const skey = (t, k) => k !== 'all' ? `quiz-session-${T[t].id}-${k}` : T[t].id === 'part2' ? 'quiz-session' : 'quiz-session-' + T[t].id;
const pkey = t => 'quiz-profile-' + T[t].id;

function readProfile(t) {
  const qs = T[t].questions, pr = readJSON(pkey(t));
  const valid = a => Array.isArray(a) && a.every(k => Number.isInteger(k) && qs[k]);
  if (pr && valid(pr.mistakes) && valid(pr.flags)) return pr;
  // первый запуск: ошибки берём из уже начатой сессии
  const main = readJSON(skey(t, 'all')), answers = main && typeof main.answers === 'object' && main.answers || {};
  const mistakes = Object.keys(answers).map(Number).filter(k => qs[k] && Array.isArray(answers[k]) && gradeOf(qs[k], answers[k]) !== 'right');
  return { mistakes, flags: [] };
}
const fresh = () => {
  const list = kind === 'all' ? null : [...p[kind]].sort((a, b) => a - b);
  return { i: list ? list[0] : 0, answers: {}, list };
};
function load(t, k) {
  test = t; kind = k; Q = T[t].questions; N = Q.length; ALL = Q.map((_, n) => n);
  p = readProfile(t);
  s = readJSON(skey(t, k));
  const okList = l => Array.isArray(l) && l.length && l.every(n => Q[n]);
  if (!s || !s.answers || typeof s.answers !== 'object' || (k !== 'all' && !okList(s.list))) s = fresh();
  if (k === 'all') s.list = null;
  if (s.list && !s.list.length) return load(t, 'all'); // ошибок или отметок нет — открываем все вопросы
  if (!ids().includes(s.i)) s.i = ids()[0];
}
const save = () => {
  try {
    localStorage.setItem(skey(test, kind), JSON.stringify(s));
    localStorage.setItem(pkey(test), JSON.stringify(p));
    localStorage.setItem('quiz-view', view);
    localStorage.setItem('quiz-test', T[test].id);
    localStorage.setItem('quiz-kind', kind);
  } catch {}
};

const ids = () => s.list || ALL;
const grade = k => gradeOf(Q[k], s.answers[k]);
const rightCount = () => Object.keys(s.answers).filter(k => grade(k) === 'right').length;
const nextUnanswered = () => {
  const L = ids(), at = L.indexOf(s.i);
  for (let d = 1; d < L.length; d++) if (!s.answers[L[(at + d) % L.length]]) return L[(at + d) % L.length];
  return -1;
};
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const desktop = matchMedia('(hover: hover) and (pointer: fine)').matches; // есть мышь и клавиатура
const anim = (node, frames, ms = 220) => { if (node && !still && node.animate) node.animate(frames, { duration: ms, easing: 'ease-out' }); };

function fillPicker() {
  $('#test').replaceChildren(...T.flatMap((x, t) => {
    const pr = t === test ? p : readProfile(t);
    return Object.entries(KINDS).map(([k, name]) => {
      const n = k === 'all' ? x.questions.length : pr[k].length;
      return el('option', { value: t + ':' + k, textContent: `${x.name}: ${name} (${n})`, disabled: !n && !(t === test && k === kind) });
    });
  }));
  $('#test').value = test + ':' + kind;
}

function stats() {
  const L = ids(), total = L.length, g = Object.keys(s.answers).map(grade), done = g.length;
  const [ok, part, bad] = ['right', 'part', 'wrong'].map(x => g.filter(y => y === x).length);
  $('#count').textContent = s.list ? `Вопрос ${s.i + 1} · ${L.indexOf(s.i) + 1} из ${total}` : `Вопрос ${s.i + 1} из ${N}`;
  $('#sDone').textContent = done;
  $('#sOk').textContent = ok;
  $('#sPart').textContent = part;
  $('#sBad').textContent = bad;
  $('#sLeft').textContent = total - done;
  $('#barOk').style.width = ok / total * 100 + '%';
  $('#barPart').style.width = part / total * 100 + '%';
  $('#barBad').style.width = bad / total * 100 + '%';
  $('#xstats').textContent = `Отвечено: ${done} из ${total} · Верно: ${ok} · Частично: ${part} · Неверно: ${bad} · Осталось: ${total - done}`;
  const a = s.answers[s.i] && grade(s.i), flagged = p.flags.includes(s.i);
  $('#xnum').textContent = s.i + 1;
  $('#xstate').textContent = { right: 'Верно', part: 'Частично правильный', wrong: 'Неверно' }[a] || 'Пока нет ответа';
  $('#xgrade').textContent = !a ? 'Макс. балл: 1,0' : `Баллов: ${a === 'right' ? '1,0' : '0,0'} из 1,0`;
  document.querySelectorAll('[data-flag]').forEach(b => {
    b.textContent = flagged ? '⚑ Снять отметку' : '⚑ Отметить вопрос';
    b.classList.toggle('on', flagged);
  });
  let sec;
  $('#grid').replaceChildren(...L.flatMap(k => {
    const q = Q[k], b = el('button', { textContent: k + 1, onclick: () => go(k) });
    b.className = 'qn' + (k === s.i ? ' cur' : '') + (s.answers[k] ? ' ' + grade(k) : '') + (p.flags.includes(k) ? ' flag' : '');
    if (!q.section || q.section === sec) return [b];
    sec = q.section;
    return [el('div', { className: 'sec', textContent: sec }), b];
  }));
}

function render(dir) {
  const q = Q[s.i], L = ids(), at = L.indexOf(s.i);
  save();
  $('#section').textContent = q.section;
  $('#q').textContent = q.q;
  $('#hint').textContent = q.multi ? 'Выберите один или несколько ответов:' : 'Выберите один ответ:';
  $('#options').replaceChildren(...q.options.map((o, k) => {
    // как на экзамене: один ответ — кружки, несколько — галочки
    const type = view === 'exam' && !q.multi ? 'radio' : 'checkbox', l = el('label');
    l.append(el('input', { type, name: 'a', value: k }), el('span', { textContent: o }));
    return l;
  }));
  $('#result').hidden = true;
  $('#check').hidden = false;
  $('#main').textContent = 'Ответить';
  $('#prev').disabled = $('#xprev').disabled = at === 0;
  $('#next').disabled = $('#xnext').disabled = at === L.length - 1;
  if (s.answers[s.i]) showResult(false); else updateMain();
  stats();
  fillPicker();
  scrollTo(0, 0);
  if (desktop && !s.answers[s.i]) boxes()[0].focus({ preventScroll: true }); // сразу можно отвечать стрелками и Enter
  // новый вопрос въезжает с той стороны, куда листаем
  if (dir) for (const n of [$('.info'), $('.box')]) anim(n, [{ opacity: 0, transform: `translateX(${dir * 24}px)` }, { opacity: 1, transform: 'none' }]);
}

// кнопка без выбранного ответа только выглядит неактивной: так на неё можно перейти стрелками
function updateMain() {
  const off = !s.answers[s.i] && !boxes().some(b => b.checked);
  $('#main').classList.toggle('off', off);
  $('#check').classList.toggle('off', off);
}

function showResult(scroll) {
  const q = Q[s.i], picked = s.answers[s.i], g = grade(s.i), ok = g === 'right', r = $('#result');
  const right = q.correct.map(k => q.options[k]), label = right.length > 1 ? 'Правильные ответы' : 'Правильный ответ';
  boxes().forEach((b, k) => {
    b.checked = picked.includes(k);
    b.disabled = true;
    b.parentNode.className = (q.correct.includes(k) ? 'ok' : b.checked ? 'bad' : '') + (b.checked ? ' picked' : '');
  });
  if (view === 'exam') r.replaceChildren(`${label}: ${right.join(', ')}`);
  else {
    r.replaceChildren(el('b', { textContent: { right: 'Правильно!', part: 'Частично правильно', wrong: 'Неправильно' }[g] }));
    if (!ok) {
      const ul = el('ul');
      ul.append(...right.map(t => el('li', { textContent: t })));
      r.append(label + ':', ul);
    }
  }
  const done = nextUnanswered() < 0;
  if (done) r.append(el('p', { textContent: `Сессия завершена: верно ${rightCount()} из ${ids().length}` }));
  r.className = { right: 'ok', part: 'part', wrong: 'bad' }[g];
  r.hidden = false;
  $('#check').hidden = true;
  $('#main').textContent = done ? 'Начать новую сессию' : 'Следующий вопрос →';
  updateMain();
  if (scroll) r.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function answer() {
  if (!boxes().some(b => b.checked)) return;
  s.answers[s.i] = boxes().filter(b => b.checked).map(b => +b.value);
  const g = grade(s.i);
  // верный ответ убирает вопрос из ошибок, неверный или частичный — добавляет
  p.mistakes = p.mistakes.filter(k => k !== s.i).concat(g === 'right' ? [] : [s.i]);
  save();
  showResult(true);
  stats();
  fillPicker();
  anim($('.qn.cur'), [{ transform: 'scale(1.35)' }, { transform: 'none' }], 350);
  anim($('#result'), [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }]);
  if (g !== 'right') navigator.vibrate?.(g === 'wrong' ? [70, 50, 70] : 60); // Android; iPhone вибрацию из браузера не даёт
  // «Проверить» скрылась — фокус на «Следующую страницу», чтобы Enter открыл следующий вопрос
  if (desktop && view === 'exam' && !$('#xnext').disabled) $('#xnext').focus({ preventScroll: true });
}

function toggleFlag() {
  p.flags = p.flags.includes(s.i) ? p.flags.filter(k => k !== s.i) : [...p.flags, s.i];
  save();
  stats();
  fillPicker();
}

const switchTo = (t, k) => { load(t, k); render(); };
function newSession() {
  s = fresh();
  if (s.list && !s.list.length) {
    alert(kind === 'mistakes' ? 'Ошибок не осталось — открываю все вопросы.' : 'Отмеченных вопросов нет — открываю все вопросы.');
    return switchTo(test, 'all');
  }
  render();
}
function restart() {
  if (Object.keys(s.answers).length && !confirm('Начать новую сессию? Ответы этой сессии будут сброшены, ошибки и отметки сохранятся.')) return;
  newSession();
}

const go = n => { const L = ids(), d = Math.sign(L.indexOf(n) - L.indexOf(s.i)); s.i = n; render(d); };
const step = d => { const L = ids(), n = L[L.indexOf(s.i) + d]; if (n !== undefined) go(n); };
const setView = v => { view = v; document.body.className = v; render(); };
$('#options').onchange = e => {
  // в вопросах с одним ответом новая галочка снимает прежнюю
  if (!Q[s.i].multi && e.target.checked) boxes().forEach(b => b.checked = b === e.target);
  updateMain();
};
$('#check').onclick = answer;
$('#main').onclick = () => {
  if (!s.answers[s.i]) return answer();
  const n = nextUnanswered();
  n < 0 ? newSession() : go(n);
};
$('#prev').onclick = $('#xprev').onclick = () => step(-1);
$('#next').onclick = $('#xnext').onclick = () => step(1);
document.addEventListener('keydown', e => {
  // стрелки на клавиатуре листают вопросы; в списке тестов стрелки работают как обычно
  if (e.altKey || e.ctrlKey || e.metaKey || e.target.tagName === 'SELECT') return;
  // ↑ ↓ ходят по кругу: варианты → «Проверить» → первый вариант; после ответа стрелки снова прокручивают страницу
  const cycle = [...boxes().filter(b => !b.disabled), view === 'exam' ? $('#check') : $('#main')];
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && cycle.length > 1) {
    const at = cycle.indexOf(document.activeElement), dv = e.key === 'ArrowDown' ? 1 : -1;
    e.preventDefault();
    cycle[at < 0 ? 0 : (at + dv + cycle.length) % cycle.length].focus();
    return;
  }
  if (e.key === 'Enter' && e.target.matches('#options input')) { // Enter отмечает или снимает вариант
    e.preventDefault();
    e.target.click();
    return;
  }
  const d = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
  if (!d) return;
  e.preventDefault(); // иначе стрелка заодно переключит выбранный кружок-вариант
  step(d);
});
// свайп влево — следующий вопрос, вправо — предыдущий; вертикальная прокрутка не мешает
let touch = null;
document.addEventListener('touchstart', e => {
  touch = e.touches.length === 1 && !e.target.closest('select') ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!touch) return;
  const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
  touch = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > 2 * Math.abs(dy)) step(dx < 0 ? 1 : -1);
}, { passive: true });
document.querySelectorAll('[data-flag]').forEach(b => b.onclick = toggleFlag);
document.querySelectorAll('[data-restart]').forEach(b => b.onclick = restart);
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(view === 'exam' ? 'cards' : 'exam'));
$('#test').onchange = e => { const [t, k] = e.target.value.split(':'); switchTo(+t, k); };

let stored = {};
try { stored = { view: localStorage.getItem('quiz-view'), test: localStorage.getItem('quiz-test'), kind: localStorage.getItem('quiz-kind') }; } catch {}
view = stored.view === 'cards' ? 'cards' : 'exam';
load(Math.max(0, T.findIndex(x => x.id === stored.test)), Object.hasOwn(KINDS, stored.kind) ? stored.kind : 'all');
setView(view);
// приложение на экране «Домой» и без интернета; просим браузер не стирать сохранённый прогресс
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
navigator.storage?.persist?.().catch(() => {});
</script>
</body>
</html>
